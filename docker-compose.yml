services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chargeback}
      POSTGRES_USER: ${POSTGRES_USER:-chargeback}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend-springboot
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-chargeback}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-chargeback}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      CAMUNDA_CLIENT_REST_ADDRESS: ${CAMUNDA_CLIENT_REST_ADDRESS:-http://host.docker.internal:8088}
      CAMUNDA_CLIENT_ZEEBE_GRPC_ADDRESS: ${CAMUNDA_CLIENT_ZEEBE_GRPC_ADDRESS:-http://host.docker.internal:26500}
      APP_WORKFLOW_ENABLED: ${APP_WORKFLOW_ENABLED:-false}
      TRANSACTION_API_BASE_URL: ${TRANSACTION_API_BASE_URL:-http://backend:8080}
      DEMO_TIMEOUT: ${DEMO_TIMEOUT:-P3D}
      HIGH_VALUE_THRESHOLD: ${HIGH_VALUE_THRESHOLD:-4000}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["8080:8080"]
  frontend:
    build: ./frontend-react
    depends_on: [backend]
    ports: ["5173:80"]
